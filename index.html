<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTG Referral Portal</title>

<style>
body{font-family:Arial;background:#eef2f7;margin:0}
.form{max-width:760px;margin:50px auto;background:#fff;padding:30px;border-radius:20px}
label{display:block;margin-top:10px;font-weight:700}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border-radius:10px;border:1px solid #ccc}
button{margin-top:20px;padding:14px;width:100%;border:none;background:#08142f;color:#fff;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}

/* MULTI STEP */
.form-step{display:none}
.form-step.active{display:block}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* SYMPTOMS STYLE */
.symptoms-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:15px;
}

.symptom-card{
background:#f5f7fb;
padding:15px;
border-radius:10px;
border:1px solid #d7dfea;
cursor:pointer;
}

.symptom-card input{
margin-right:6px;
}
</style>
</head>

<body>

<div class="form">

<form action="https://formsubmit.co/admin@ligonrazon.solutions" method="POST">

<input type="hidden" name="_subject" value="New CTG Referral Submission">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" id="redirectURL">

<!-- STEP 1 -->
<div class="form-step active" id="step1">

<h2>Submit a Patient Referral</h2>

<label>Law Firm / Provider Name</label>
<input name="lawfirm" id="lawfirm" required>

<label>Case Manager / Paralegal</label>
<input name="case_manager">

<label>Patient's Full Name</label>
<input name="patient_name">

<label>Patient Address</label>
<input name="patient_address">

<div class="grid2">
<div>
<label>Date of Birth</label>
<input type="date" name="dob">
</div>

<div>
<label>Date of Incident</label>
<input type="date" name="doi">
</div>
</div>

<div class="grid2">
<div>
<label>Phone Number</label>
<input name="phone">
</div>

<div>
<label>Workers Comp?</label>
<select name="workers_comp">
<option>Yes</option>
<option>No</option>
</select>
</div>
</div>

<label>PIP Details</label>
<textarea name="pip_details"></textarea>

<button type="button" onclick="nextStep()">Next</button>

</div>

<!-- STEP 2 -->
<div class="form-step" id="step2">

<h2>Patient Symptoms</h2>
<p>Select all that apply</p>

<div class="symptoms-grid">

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Verbal Communication"> Verbal Communication</label>

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Light Sensitivity"> Light Sensitivity</label>

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Sleep Difficulty"> Sleep Difficulty</label>

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Fear of Travel"> Fear of Travel</label>

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Headaches"> Headaches</label>

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Wooziness"> Wooziness</label>

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Lightheadedness"> Lightheadedness</label>

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Emotional Changes"> Emotional Changes</label>

<label class="symptom-card"><input type="checkbox" name="symptoms[]" value="Nervousness"> Nervousness</label>

</div>

<button type="button" onclick="prevStep()">Back</button>
<button type="submit">Submit Referral</button>

</div>

</form>

</div>

<script>

function nextStep(){
document.getElementById("step1").classList.remove("active");
document.getElementById("step2").classList.add("active");
}

function prevStep(){
document.getElementById("step2").classList.remove("active");
document.getElementById("step1").classList.add("active");
}

// 🔥 Dynamic redirect with law firm name
document.querySelector("form").addEventListener("submit", function(){
const firm = document.getElementById("lawfirm").value;
document.getElementById("redirectURL").value =
`https://yourdomain.com/thank-you.html?firm=${encodeURIComponent(firm)}`;
});

</script>

</body>
</html>
