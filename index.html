<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTG Referral Portal | The Concussion Therapy Group</title>
  <meta name="description" content="Secure, 24-hour concussion referral portal for law firms and medical providers. Submit patient referrals to The Concussion Therapy Group.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-shell" id="pageShell">

<header>
  <div class="logo-wrap">
    <span class="logo-main">CTG</span>
    <div class="logo-divider"></div>
    <div class="logo-text-wrap">
      <div class="logo-line-accent">The Concussion</div>
      <div class="logo-line">Therapy Group</div>
    </div>
  </div>
  <button type="button" class="btn open-form-btn">Submit Referral</button>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Concussion <br>Referrals Made <em>Simple.</em></h1>
    <p class="hero-sub">The premier secure referral portal for Law Firms and Providers</p>
    <button class="btn-primary open-form-btn">Submit a Referral</button>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="logo-main">CTG</span>
      <span class="tagline">The Concussion Therapy Group</span>
      <p>Professional concussion referral solutions with fast, secure, and patient-focused intake services.</p>
    </div>
  </div>
</footer>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="formModal">
  <div class="modal-dialog">

    <div class="modal-header">
      <h2>Submit a Patient Referral</h2>
      <button id="closeModalBtn">×</button>
    </div>

    <form id="referralForm">

      <!-- PATIENT INFO -->
      <label for="patient_first_name">Patient's First Name</label>
      <input id="patient_first_name" name="Patient First Name" type="text" required>

      <label for="patient_last_name">Patient's Last Name</label>
      <input id="patient_last_name" name="Patient Last Name" type="text" required>

      <label for="patient_full_address">Patient's Full Address</label>
      <input id="patient_full_address" name="Patient Full Address" type="text" required>

      <button type="submit">Submit</button>

    </form>

  </div>
</div>

<script>
const referralForm = document.getElementById('referralForm');

function buildSheetPayload() {
  return {
    patientFirstName: document.getElementById('patient_first_name').value,
    patientLastName: document.getElementById('patient_last_name').value,
    patientFullAddress: document.getElementById('patient_full_address').value
  };
}

referralForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const data = buildSheetPayload();
  console.log("Submitting:", data);
});
</script>

</body>
</html>
